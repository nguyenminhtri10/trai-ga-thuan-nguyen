<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Live Stream | Admin</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-feather-pointed"></i> <span>Trị Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin.html"><i class="fa-solid fa-gauge"></i> Tổng Quan</a></li>
                <li><a href="admin-products.html"><i class="fa-solid fa-crow"></i> Quản Lý Gà</a></li>
                <li><a href="admin-orders.html"><i class="fa-solid fa-cart-shopping"></i> Đơn Hàng</a></li>
                <li><a href="admin-users.html"><i class="fa-solid fa-users"></i> Khách Hàng</a></li>
                <li><a href="admin-livestream.html" class="active"><i class="fa-solid fa-video"></i> Live Stream</a>
                </li>

                <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <h2>Quản Lý Live Stream</h2>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <img src="https://via.placeholder.com/40" alt="Admin" class="user-avatar">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="content-wrapper">

                <div class="card">
                    <div class="card-header">
                        <h3>Cấu Hình Live Stream</h3>
                    </div>
                    <div class="card-body">
                        <form id="livestreamForm" class="admin-form">
                            <div class="form-group">
                                <label>Tiêu Đề Stream (Lưu Lịch Sử)</label>
                                <input type="text" id="streamTitle" class="form-control"
                                    placeholder="Ví dụ: Xổ gà tre siêu mỹ..." required>
                            </div>
                            <div class="form-group">
                                <label>Đường Dẫn Embed Video (YouTube Embed URL)</label>
                                <input type="text" id="streamUrl" class="form-control"
                                    placeholder="Ví dụ: https://www.youtube.com/embed/..." required>
                                <small style="display: block; margin-top: 5px; color: #666;">
                                    Hướng dẫn: Vào video YouTube > Chia sẻ > Nhúng (Embed) > Copy link trong src="..."
                                </small>
                            </div>

                            <div class="form-group">
                                <label>Xem Trước:</label>
                                <div
                                    style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border-radius: 8px; border: 1px solid #ddd; background: #000;">
                                    <iframe id="previewFrame" src=""
                                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                                        frameborder="0" allowfullscreen></iframe>
                                </div>
                            </div>

                            <div class="form-actions-right">
                                <button type="submit" class="btn btn-primary">Lưu Cấu Hình</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- History Table -->
            <div class="card" style="margin-top: 30px;">
                <div class="card-header">
                    <h3>Lịch Sử Live Stream</h3>
                </div>
                <div class="card-body">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Ngày</th>
                                <th>Tiêu Đề</th>
                                <th>Link</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>

    </div>
    </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlInput = document.getElementById('streamUrl');
            const previewFrame = document.getElementById('previewFrame');

            // Load current config (Get latest from history)
            try {
                const res = await fetch('/api/livestreams');
                const data = await res.json();
                if (data && data.length > 0) {
                    urlInput.value = data[0].url;
                    previewFrame.src = data[0].url;
                    document.getElementById('streamTitle').value = data[0].title || '';
                }
            } catch (error) {
                console.error(error);
            }

            // Preview on change
            urlInput.addEventListener('input', () => {
                previewFrame.src = urlInput.value;
            });

            // Save config and history
            document.getElementById('livestreamForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const url = urlInput.value;
                const title = document.getElementById('streamTitle').value;

                try {
                    // Add to history (This is now the SOURCE clearly)
                    const resHistory = await fetch('/api/livestreams', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, url })
                    });

                    if (resHistory.ok) {
                        alert('Đã cập nhật Live Stream và lưu vào danh sách!');
                        fetchHistory(); // Reload table
                    } else {
                        alert('Cập nhật thất bại');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Lỗi kết nối');
                }
            });

            // Fetch History
            async function fetchHistory() {
                try {
                    const res = await fetch('/api/livestreams');
                    const history = await res.json();

                    const tbody = document.getElementById('historyTableBody');
                    tbody.innerHTML = '';

                    history.forEach(item => {
                        const date = new Date(item.date).toLocaleDateString('vi-VN');
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${date}</td>
                            <td>${item.title}</td>
                            <td><a href="${item.url}" target="_blank">Xem Link</a></td>
                            <td>
                                <button class="action-btn delete" onclick="deleteHistory('${item._id}')"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (error) {
                    console.error('Error fetching history:', error);
                }
            }

            // Initial fetch
            fetchHistory();

            // Expose delete function to window
            window.deleteHistory = async (id) => {
                if (confirm('Bạn có chắc muốn xóa lịch sử này?')) {
                    try {
                        await fetch('/api/livestreams/' + id, { method: 'DELETE' });
                        fetchHistory();
                    } catch (error) {
                        alert('Xóa thất bại');
                    }
                }
            };
        });
    </script>
</body>

</html>
