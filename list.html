<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Chiến Kê | Trại Gà Trị Nguyễn</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Danh sách chiến kê tại Trại Gà Trị Nguyễn. Cập nhật mới nhất các dòng gà nòi, gà tre đẳng cấp.">
    <meta name="keywords" content="trại gà trị nguyễn, gà nòi, gà tre, gà đá, danh sách gà">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* List Page Specific Styles */
        .page-header {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('assets/hero-bg.png');
            background-size: cover;
            background-position: center;
            padding: 120px 0 60px;
            text-align: center;
            color: var(--white);
            margin-bottom: 40px;
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: #ddd;
        }

        .breadcrumb a {
            color: var(--white);
        }

        .breadcrumb i {
            margin: 0 10px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title animate-fade-up">Danh Sách Chiến Kê</h1>
            <div class="breadcrumb animate-fade-up delay-1">
                <a href="index.html">Trang Chủ</a> <i class="fa-solid fa-chevron-right"></i> <span>Tất Cả Sản
                    Phẩm</span>
            </div>
        </div>
    </section>

    <!-- Product List -->
    <section class="products section-padding bg-light" style="padding-top: 20px;">
        <div class="container">

            <div id="listProductGrid" class="product-grid">
                <!-- Product 1 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <span class="badge">Mới Nhất</span>
                        <h3>Gà Điều Chân Xanh</h3>
                        <p class="price">Liên hệ</p>
                        <a href="detail.html" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <span class="badge hot">Hot</span>
                        <h3>Gà Chuối Gấm</h3>
                        <p class="price">Liên hệ</p>
                        <a href="#contact" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <h3>Gà Xám Cú</h3>
                        <p class="price">Liên hệ</p>
                        <a href="#contact" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <!-- Product 4 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <span class="badge">VIP</span>
                        <h3>Gà Cú Lửa</h3>
                        <p class="price">Liên hệ</p>
                        <a href="#contact" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <!-- Product 5 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <h3>Gà Que Xanh</h3>
                        <p class="price">Liên hệ</p>
                        <a href="#contact" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <!-- Product 6 -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="img-placeholder"><i class="fa-solid fa-crow"></i></div>
                    </div>
                    <div class="product-info">
                        <span class="badge hot">Hot</span>
                        <h3>Gà Khét Sữa</h3>
                        <p class="price">Liên hệ</p>
                        <a href="#contact" class="btn-link">Chi tiết <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>

            <!-- Pagination (Mockup) -->
            <div class="text-center mt-4">
                <div id="listPagination" style="display: inline-flex; gap: 10px;">
                    <a href="#" class="btn btn-outline-dark active" style="background: var(--dark); color: white;">1</a>
                    <a href="#" class="btn btn-outline-dark">2</a>
                    <a href="#" class="btn btn-outline-dark">3</a>
                    <a href="#" class="btn btn-outline-dark"><i class="fa-solid fa-arrow-right"></i></a>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
