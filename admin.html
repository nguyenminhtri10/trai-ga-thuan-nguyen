<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống | Admin</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-feather-pointed"></i> <span>Thuận Admin</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="admin.html" class="active"><i class="fa-solid fa-gauge"></i> Tổng Quan</a></li>
                <li><a href="admin-products.html"><i class="fa-solid fa-crow"></i> Quản Lý Gà</a></li>
                <li><a href="admin-orders.html"><i class="fa-solid fa-cart-shopping"></i> Đơn Hàng</a></li>
                <li><a href="admin-users.html"><i class="fa-solid fa-users"></i> Khách Hàng</a></li>
                <li><a href="admin-livestream.html"><i class="fa-solid fa-video"></i> Live Stream</a></li>

                <li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <h2>Tổng Quan Hệ Thống</h2>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <img src="https://via.placeholder.com/40" alt="Admin" class="user-avatar">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="content-wrapper">

                <!-- Dashboard Stats -->
                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                    <div class="card"
                        style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <h3 id="total-products" style="font-size: 2rem; color: var(--primary-color);">...</h3>
                            <p style="color: #666;">Tổng số Chiến Kê</p>
                        </div>
                        <i class="fa-solid fa-crow" style="font-size: 2.5rem; color: #ddd;"></i>
                    </div>
                    <div class="card"
                        style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <h3 id="total-orders" style="font-size: 2rem; color: var(--secondary-color);">...</h3>
                            <p style="color: #666;">Đơn Hàng Mới</p>
                        </div>
                        <i class="fa-solid fa-cart-shopping" style="font-size: 2.5rem; color: #ddd;"></i>
                    </div>
                    <div class="card"
                        style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <h3 id="total-users" style="font-size: 2rem; color: #4CAF50;">...</h3>
                            <p style="color: #666;">Khách Hàng</p>
                        </div>
                        <i class="fa-solid fa-users" style="font-size: 2.5rem; color: #ddd;"></i>
                    </div>
                    <div class="card"
                        style="padding: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <h3 id="total-livestreams" style="font-size: 2rem; color: #FF9800;">...</h3>
                            <p style="color: #666;">Tổng lượt Live Stream</p>
                        </div>
                        <i class="fa-solid fa-chart-line" style="font-size: 2.5rem; color: #ddd;"></i>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>Hoạt Động Gần Đây</h3>
                    </div>
                    <div class="card-body">
                        <ul id="activity-list" style="list-style: none;">
                            <li>Đang tải...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin-dashboard.js"></script>
</body>

</html>
