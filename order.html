<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng | Trại Gà Trị Nguyễn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('assets/hero-bg.png');
            background-size: cover;
            background-position: center;
            padding: 80px 0 40px;
            text-align: center;
            color: var(--white);
            margin-bottom: 40px;
        }

        .auth-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
            }
        }

        .order-summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .product-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .product-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container header-container">
            <div class="logo-wrapper" style="display: flex; flex-direction: column; align-items: flex-start;">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-feather-pointed"></i> Trị Nguyễn
                </a>
            </div>
            <nav class="navbar">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Trang Chủ</a></li>
                    <li><a href="list.html" class="nav-link">Sản Phẩm</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="page-title">Xác Nhận Đơn Hàng</h1>
        </div>
    </section>

    <!-- Order Form Section -->
    <section class="section-padding bg-light" style="padding-top: 0;">
        <div class="container">
            <div class="auth-container">

                <!-- Order Form -->
                <div>
                    <h2 style="margin-bottom: 20px; color: var(--primary-color);">Thông Tin Giao Hàng</h2>
                    <form id="orderPageForm" class="auth-form-inner">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Họ và Tên</label>
                            <input type="text" id="orderName" class="form-control"
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
                                placeholder="Nhập tên của bạn" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Số Điện Thoại</label>
                            <input type="tel" id="orderPhone" class="form-control"
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"
                                placeholder="Nhập số điện thoại" required>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Địa Chỉ Giao
                                Hàng</label>
                            <textarea id="orderAddress" class="form-control"
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; height: 80px;"
                                placeholder="Nhập địa chỉ của bạn" required></textarea>
                        </div>
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Ghi Chú (Tùy
                                chọn)</label>
                            <textarea id="orderNote" class="form-control"
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; height: 60px;"
                                placeholder="Ví dụ: Giao vào buổi chiều..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary"
                            style="width: 100%; padding: 12px; border: none; cursor: pointer;">Hoàn Tất Đặt
                            Hàng</button>
                    </form>
                </div>

                <!-- Summary -->
                <div class="order-summary">
                    <h3 style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">Đơn Hàng Của
                        Bạn</h3>
                    <div id="productLoading">Đang tải thông tin sản phẩm...</div>
                    <div id="productPreview" style="display: none;">
                        <div class="product-preview">
                            <img id="summaryImage" src="" alt="Product">
                            <div>
                                <h4 id="summaryName" style="margin: 0; font-size: 1rem;">Product Name</h4>
                                <p id="summaryPrice"
                                    style="margin: 5px 0; color: var(--primary-color); font-weight: bold;">0đ</p>
                            </div>
                        </div>
                        <div style="border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                                <span>Tạm tính:</span>
                                <span id="subTotal">0đ</span>
                            </div>
                            <div
                                style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; color: var(--dark);">
                                <span>Tổng cộng:</span>
                                <span id="totalPrice">0đ</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom text-center">
                <p>&copy; 2026 Trại Gà Trị Nguyễn. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
