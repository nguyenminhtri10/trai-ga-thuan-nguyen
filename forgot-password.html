<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu | Trại Gà Trị Nguyễn</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-page-container">
        <div class="auth-box animate-fade-up">
            <a href="login.html" class="home-link"><i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập</a>

            <div class="auth-header">
                <i class="fa-solid fa-feather-pointed logo-icon"></i> Trị Nguyễn
            </div>

            <div class="text-center" style="margin-bottom: 20px;">
                <h3 style="color: var(--primary-color); serif; font-family: var(--font-heading);">Khôi Phục Mật Khẩu
                </h3>
                <p style="font-size: 0.9rem; color: #666; margin-top: 5px;">Nhập email của bạn để nhận hướng dẫn đặt lại
                    mật khẩu</p>
            </div>

            <div class="auth-forms">
                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="auth-form active">
                    <div class="form-group">
                        <label for="recoveryEmail">Email đăng ký</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="recoveryEmail" placeholder="Nhập địa chỉ email của bạn" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Gửi Yêu
                        Cầu</button>

                    <div class="divider"><span>Hoặc</span></div>

                    <div class="text-center" style="margin-top: 15px;">
                        <span style="font-size: 0.9rem;">Chưa có tài khoản? <a href="login.html"
                                style="color: var(--primary-color); font-weight: bold;">Đăng ký ngay</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Simple Script for Feedback -->
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('recoveryEmail').value;
            alert(`Yêu cầu đặt lại mật khẩu đã được gửi đến: ${email}\nVui lòng kiểm tra hộp thư của bạn!`);
            // Here you would typically send an API request to your backend
        });
    </script>
</body>

</html>
